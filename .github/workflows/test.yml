name: Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Test (${{ matrix.backends.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        backends:
          - name: SecureTransport + ssh exec
            flags: ""
          - name: OpenSSL + libssh2
            flags: --traits OpenSSL,LibSSH2

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: Run tests
      run: swift test ${{ matrix.backends.flags }}
